<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — Application Status</title><style>:root{--bg:#080b14;--card:#101626e8;--line:#26334c;--text:#f4f7ff;--muted:#9ba9c2;--purple:#806cff;--mint:#18d6a7;--red:#ff657a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:16px system-ui,sans-serif;background:radial-gradient(circle at 15% 0,#806cff35,transparent 32%),radial-gradient(circle at 90% 15%,#18d6a72a,transparent 30%),linear-gradient(145deg,#080b14,#0d1422)}.wrap{width:min(650px,92%);margin:auto}.nav{height:72px;border-bottom:1px solid #ffffff12;display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:1000;letter-spacing:.12em}.logo span{color:var(--purple)}a{color:var(--muted);text-decoration:none;font-weight:800}.main{padding:75px 0}.card{border:1px solid var(--line);background:var(--card);border-radius:25px;padding:32px;box-shadow:0 25px 80px #0005}.eyebrow{color:#9b8dff;font-weight:900;font-size:12px;letter-spacing:.14em}.card h1{font-size:42px;margin:10px 0}.muted{color:var(--muted);line-height:1.7}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#080e1b;color:#fff;margin:15px 0 8px;outline:none;font:inherit}.field:focus{border-color:#806cffaa;box-shadow:0 0 0 4px #806cff15}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#806cff,#5b45dd);color:#fff;font-weight:950;cursor:pointer}.result{margin-top:22px}.status{padding:18px;border-radius:17px;border:1px solid var(--line);background:#ffffff06}.status strong{display:block;font-size:25px;margin-bottom:7px}.pending strong{color:#ffd36e}.accepted strong{color:#6ee7c8}.rejected strong{color:#ff9baa}.meta{color:var(--muted);font-size:13px;margin-top:15px}.error{color:#ff9baa;margin-top:12px}.hidden{display:none}.hint{font-size:13px;color:#738199;margin-top:14px;line-height:1.6}</style></head><body><header class="nav"><div class="wrap navin"><a class="logo" href="index.html">NEXORA<span>.</span></a><a href="join.html">التقديم</a></div></header><main class="main wrap"><section class="card"><div class="eyebrow">NEXORA • APPLICATION TRACKER</div><h1>تابع حالة طلبك</h1><p class="muted">اكتب <b>اسم المستخدم فقط</b> الذي قدمت به طلبك لمعرفة حالته. لا تحتاج إلى رابط أو كود خاص.</p><form id="form"><input class="field" id="username" placeholder="اسم المستخدم — مثال: ahmed_dev" autocomplete="username" pattern="[A-Za-z0-9_-]{3,40}" required><button class="btn">عرض حالة الطلب</button></form><div id="error" class="error"></div><div id="result" class="result hidden"></div><div class="hint">استخدم نفس الـ Username الذي كتبته في نموذج التقديم. لا يتم طلب أي كود تتبع.</div></section></main><script>const API='',form=document.querySelector('#form'),usernameInput=document.querySelector('#username'),result=document.querySelector('#result'),error=document.querySelector('#error');const initial=new URLSearchParams(location.search).get('username');if(initial)usernameInput.value=initial;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function check(){const username=usernameInput.value.trim().replace(/^@/,'').toLowerCase();if(!username)return;error.textContent='';result.className='result';result.innerHTML='جارٍ البحث…';try{const r=await fetch(API+'/api/applications/status/'+encodeURIComponent(username));const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'لم يتم العثور على طلب بهذا الاسم');const labels={pending:['pending','قيد المراجعة — طلبك وصل للإدارة.'],accepted:['accepted','تم القبول — أهلاً بك في فريق NEXORA! 🎉'],rejected:['rejected','لم يتم قبول الطلب في الوقت الحالي.']};const [cls,text]=labels[j.status]||labels.pending;result.innerHTML=`<div class="status ${cls}"><strong>${esc(text)}</strong><div>المتقدم: @${esc(j.username)} · نتيجة التحدي: ${esc(j.score)}%</div><div class="meta">تاريخ التقديم: ${esc(j.created_at)}</div></div>`}catch(e){result.className='result hidden';error.textContent=e.message||'تعذر تحميل حالة الطلب.'}}form.addEventListener('submit',e=>{e.preventDefault();check()});if(initial)check();</script></body></html>
