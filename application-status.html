<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — Application Status</title><style>:root{--bg:#080b14;--card:#101626e8;--line:#26334c;--text:#f4f7ff;--muted:#9ba9c2;--purple:#806cff;--mint:#18d6a7;--red:#ff657a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:16px system-ui,sans-serif;background:radial-gradient(circle at 15% 0,#806cff35,transparent 32%),radial-gradient(circle at 90% 15%,#18d6a72a,transparent 30%),linear-gradient(145deg,#080b14,#0d1422)}.wrap{width:min(650px,92%);margin:auto}.nav{height:72px;border-bottom:1px solid #ffffff12;display:flex;align-items:center}.navin{display:flex;justify-content:space-between}.logo{font-size:23px;font-weight:1000;letter-spacing:.12em}.logo span{color:var(--purple)}a{color:var(--muted);text-decoration:none;font-weight:800}.main{padding:75px 0}.card{border:1px solid var(--line);background:var(--card);border-radius:25px;padding:32px;box-shadow:0 25px 80px #0005}.eyebrow{color:#9b8dff;font-weight:900;font-size:12px;letter-spacing:.14em}.card h1{font-size:42px;margin:10px 0}.muted{color:var(--muted);line-height:1.7}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#080e1b;color:#fff;margin:15px 0 8px;outline:none}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#806cff,#5b45dd);color:#fff;font-weight:950;cursor:pointer}.result{margin-top:22px}.status{padding:18px;border-radius:17px;border:1px solid var(--line);background:#ffffff06}.status strong{display:block;font-size:25px;margin-bottom:7px}.pending strong{color:#ffd36e}.accepted strong{color:#6ee7c8}.rejected strong{color:#ff9baa}.meta{color:var(--muted);font-size:13px;margin-top:15px}.error{color:#ff9baa;margin-top:12px}.hidden{display:none}</style></head><body><header class="nav"><div class="wrap navin"><a class="logo" href="index.html">NEXORA<span>.</span></a><a href="join.html">Apply</a></div></header><main class="main wrap"><section class="card"><div class="eyebrow">NEXORA • APPLICATION TRACKER</div><h1>Track your application</h1><p class="muted">Use the private status link you received after submitting your application. Keep it private; anyone with the link can view that application's status.</p><form id="form"><input class="field" id="token" placeholder="Application status token" autocomplete="off" required><button class="btn">Check status</button></form><div id="error" class="error"></div><div id="result" class="result hidden"></div></section></main><script>const API='https://ahmedadlyabodhb-wvyxf.faable.link';const form=document.querySelector('#form'),tokenInput=document.querySelector('#token'),result=document.querySelector('#result'),error=document.querySelector('#error');const initial=new URLSearchParams(location.search).get('token');if(initial)tokenInput.value=initial;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function check(){const token=tokenInput.value.trim();if(!token)return;error.textContent='';result.className='result';result.innerHTML='Loading…';try{const r=await fetch(API+'/api/applications/status/'+encodeURIComponent(token));const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Could not find application');const labels={pending:['pending','Pending — your application is under review.'],accepted:['accepted','Accepted — welcome to the NEXORA team! 🎉'],rejected:['rejected','Rejected — your application was not accepted at this time.']};const [cls,text]=labels[j.status]||labels.pending;result.innerHTML=`<div class="status ${cls}"><strong>${esc(text)}</strong><div>Applicant: ${esc(j.name)} · Challenge score: ${esc(j.score)}%</div><div class="meta">Submitted: ${esc(j.created_at)}</div></div>`}catch(e){result.className='result hidden';error.textContent=e.message||'Could not load application status.'}}form.addEventListener('submit',e=>{e.preventDefault();check()});if(initial)check();</script></body></html>
