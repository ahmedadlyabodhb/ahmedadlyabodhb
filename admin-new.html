<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA Admin</title>
<style>
:root{--bg:#070b14;--card:#101827;--line:#25334b;--text:#f5f7ff;--muted:#94a3bd;--p:#806cff;--g:#18d6a7;--r:#ff667d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#806cff25,transparent 32%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.wrap{width:min(1150px,92%);margin:auto}.top{height:68px;border-bottom:1px solid #ffffff15;background:#080d18ee;display:flex;align-items:center}.topin{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;letter-spacing:.1em}.brand b{color:var(--p)}a{color:var(--muted);text-decoration:none;font-weight:800}.login{min-height:calc(100vh - 68px);display:grid;place-items:center}.box{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:#101827ee;box-shadow:0 30px 100px #0008}.box h1{margin:0 0 8px;font-size:34px}.muted{color:var(--muted);line-height:1.6}.field{width:100%;padding:12px 13px;margin:6px 0;border:1px solid var(--line);border-radius:12px;background:#080e19;color:var(--text);outline:0}.field:focus{border-color:#806cff99;box-shadow:0 0 0 3px #806cff18}.btn{border:0;border-radius:12px;padding:12px 15px;background:linear-gradient(135deg,#806cff,#5b45dc);color:white;font-weight:950;cursor:pointer}.wide{width:100%;margin-top:8px}.btn:disabled{opacity:.55}.status{margin-top:12px;min-height:24px;font-size:13px}.error{padding:12px;border:1px solid #ff667d55;border-radius:12px;background:#ff667d0c;color:#ffb0bc;white-space:pre-wrap;word-break:break-word}.success{color:#73ead2}.dash{padding:35px 0 70px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.head h1{font-size:clamp(34px,5vw,52px);margin:5px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost,.tab{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff0;color:var(--muted);font-weight:850;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:17px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.stat strong{display:block;font-size:28px}.stat span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0 0}.tab{white-space:nowrap}.tab.active{color:#fff;border-color:#806cff88;background:#806cff18}.panel{display:none;margin-top:13px;padding:21px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.panel.active{display:block}.row{padding:16px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.meta{color:var(--muted);font-size:12px;line-height:1.6}.body{margin-top:8px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:900;margin-left:5px;border:1px solid #fff2}.pending{color:#ffd783}.accepted{color:#6ee7c8}.rejected{color:#ff9aaa}.danger{color:#ff9aaa}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{padding:15px;border:1px solid var(--line);border-radius:14px}.check{display:flex;gap:8px;align-items:center;margin:12px 0}.check input{width:18px;height:18px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.head{align-items:start;flex-direction:column}.settings{grid-template-columns:1fr}.actions{width:100%}.actions>*{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div class="brand">NEXORA<b>.</b> ADMIN</div><a href="index.html">← Site</a></div></header>
<main id="root"></main>
<script>
const root=document.querySelector('#root');
let state={apps:[],messages:[],members:[],settings:{}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){let r;try{r=await fetch(path,{credentials:'include',...opt})}catch(e){throw new Error('NETWORK ERROR: '+e.message+'\nCould not reach the server. Check the deployment and try again.')}let text=await r.text();let j={};try{j=text?JSON.parse(text):{}}catch{}if(!r.ok){throw new Error(`HTTP ${r.status} ${r.statusText}\n${j.error||text||'No response body'}`)}return j}
function login(){root.innerHTML='<section class="login"><form class="box" id="login"><h1>Admin Access</h1><p class="muted">Secure NEXORA control center.</p><input class="field" name="username" autocomplete="username" required placeholder="Admin username"><input class="field" name="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn wide" id="loginBtn">Sign in</button><div id="loginStatus" class="status"></div></form></section>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let f=e.currentTarget,b=document.querySelector('#loginBtn'),s=document.querySelector('#loginStatus');b.disabled=true;s.className='status';s.textContent='Signing in…';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});s.className='status success';s.textContent='Login successful. Loading dashboard…';await boot()}catch(err){s.className='status error';s.textContent=err.message}finally{b.disabled=false}}}
function shell(){root.innerHTML='<section class="dash wrap"><div class="head"><div><div style="color:#9b8dff;font-weight:900;letter-spacing:.12em;font-size:11px">NEXORA CONTROL CENTER</div><h1>Admin Dashboard</h1><div class="muted">Applications, messages, members and site controls.</div></div><div class="actions"><button class="ghost" onclick="refresh()">↻ Refresh</button><button class="ghost" onclick="logout()">Log out</button></div></div><div class="stats" id="stats"></div><nav class="tabs"><button class="tab active" data-tab="apps">Applications</button><button class="tab" data-tab="messages">Messages</button><button class="tab" data-tab="members">Members</button><button class="tab" data-tab="site">Site controls</button></nav><section class="panel active" id="apps"><h2>Applications</h2><div id="appsList">Loading…</div></section><section class="panel" id="messages"><h2>Messages</h2><div id="msgList">Loading…</div></section><section class="panel" id="members"><h2>Members</h2><div id="membersList">Loading…</div></section><section class="panel" id="site"><h2>Site controls</h2><div class="settings"><div class="setting"><label>Site title</label><input class="field" id="siteTitle"><label>Site mode</label><select class="field" id="siteStatus"><option value="online">Online</option><option value="maintenance">Maintenance</option></select></div><div class="setting"><label class="check"><input id="nexoraEnabled" type="checkbox"> NEXORA enabled</label><label class="check"><input id="contactEnabled" type="checkbox"> Contact enabled</label><label>Maintenance message</label><textarea class="field" id="maintenanceMessage" rows="4"></textarea></div></div><button class="btn" onclick="saveSettings()">Save settings</button><div id="saveStatus" class="status"></div></section></section>';document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===t.dataset.tab))});applySettings()}
function stats(s){document.querySelector('#stats').innerHTML=`<div class="stat"><strong>${s.applications??0}</strong><span>Applications</span></div><div class="stat"><strong>${s.pending??0}</strong><span>Pending</span></div><div class="stat"><strong>${s.members??0}</strong><span>Members</span></div><div class="stat"><strong>${s.messages??0}</strong><span>Messages</span></div>`}
function render(){document.querySelector('#appsList').innerHTML=state.apps.length?state.apps.map(x=>`<article class="row"><b>${esc(x.name)}</b><span class="pill ${esc(x.status)}">${esc(x.status)}</span><div class="meta">@${esc(x.username)} · #${x.id} · Score ${x.score} · ${esc(x.github||'No GitHub')} · ${esc(x.created_at)}</div><div class="body"><b>Skills:</b> ${esc(x.skills)}\n<b>Why:</b> ${esc(x.why)}</div><div class="actions"><button class="ghost" onclick="setApp(${x.id},'accepted')">Accept</button><button class="ghost danger" onclick="setApp(${x.id},'rejected')">Reject</button><button class="ghost danger" onclick="deleteApp(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No applications.</div>';document.querySelector('#msgList').innerHTML=state.messages.length?state.messages.map(x=>`<article class="row"><b>${esc(x.name)}</b><div class="meta">${esc(x.email||'No email')} · #${x.id} · ${esc(x.created_at)}</div><div class="body">${esc(x.message)}</div><button class="ghost danger" onclick="deleteMsg(${x.id})">Delete</button></article>`).join(''):'<div class="empty">No messages.</div>';document.querySelector('#membersList').innerHTML=state.members.length?state.members.map(x=>`<article class="row"><b>${esc(x.name)}</b><span class="pill ${x.active?'accepted':'rejected'}">${x.active?'active':'inactive'}</span><div class="meta">@${esc(x.username)} · ${esc(x.role||'Developer')} · ${esc(x.github||'No GitHub')}</div><div class="body">${esc(x.bio||'')}\nSkills: ${esc(x.skills||'')}</div></article>`).join(''):'<div class="empty">No members.</div>'}
function applySettings(){if(!document.querySelector('#siteTitle'))return;document.querySelector('#siteTitle').value=state.settings.site_title||'';document.querySelector('#siteStatus').value=state.settings.site_status||'online';document.querySelector('#nexoraEnabled').checked=state.settings.nexora_enabled!=='false';document.querySelector('#contactEnabled').checked=state.settings.contact_enabled!=='false';document.querySelector('#maintenanceMessage').value=state.settings.maintenance_message||''}
async function refresh(){try{let [s,a,m,mb,c]=await Promise.all([api('/api/admin/summary'),api('/api/admin/applications'),api('/api/admin/messages'),api('/api/admin/members'),api('/api/admin/site-config')]);state.apps=a.applications||a;state.messages=m.messages||m;state.members=mb.members||mb;state.settings=c.settings||c;stats(s);render();applySettings()}catch(e){login();let s=document.querySelector('#loginStatus');s.className='status error';s.textContent='SESSION / DASHBOARD ERROR:\n'+e.message}}
async function boot(){try{await api('/api/admin/summary');shell();await refresh()}catch(e){login();let s=document.querySelector('#loginStatus');if(s){s.className='status error';s.textContent='AUTH CHECK FAILED:\n'+e.message}}}
async function setApp(id,status){try{await api('/api/admin/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}
async function deleteApp(id){if(!confirm('Delete this application permanently?'))return;try{await api('/api/admin/applications/'+id,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}}
async function deleteMsg(id){if(!confirm('Delete this message permanently?'))return;try{await api('/api/admin/messages/'+id,{method:'DELETE'});await refresh()}catch(e){alert(e.message)}}
async function saveSettings(){let s=document.querySelector('#saveStatus');try{await api('/api/admin/site-config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_title:document.querySelector('#siteTitle').value,site_status:document.querySelector('#siteStatus').value,nexora_enabled:document.querySelector('#nexoraEnabled').checked?'true':'false',contact_enabled:document.querySelector('#contactEnabled').checked?'true':'false',maintenance_message:document.querySelector('#maintenanceMessage').value})});s.className='status success';s.textContent='Saved successfully.'}catch(e){s.className='status error';s.textContent=e.message}}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}finally{login()}}
boot();
</script>
</body></html>
