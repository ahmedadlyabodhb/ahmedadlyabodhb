<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Control Center</title>
<style>
:root{--bg:#070b14;--card:#101827;--card2:#0c1320;--line:#25334b;--text:#f5f7ff;--muted:#94a3bd;--p:#806cff;--g:#18d6a7;--r:#ff667d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#806cff28,transparent 30%),radial-gradient(circle at 90% 10%,#18d6a71b,transparent 28%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,textarea,select{font:inherit}.wrap{width:min(1180px,92%);margin:auto}.top{position:sticky;top:0;z-index:10;border-bottom:1px solid #fff1;background:#080d18dd;backdrop-filter:blur(18px)}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:20px;font-weight:1000;letter-spacing:.1em}.brand b{color:var(--p)}a{color:var(--muted);text-decoration:none;font-weight:850}.login{min-height:calc(100vh - 68px);display:grid;place-items:center}.box{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:#101827ee;box-shadow:0 30px 100px #0007}.box h1{margin:0 0 7px;font-size:34px}.muted{color:var(--muted);line-height:1.65}.field{width:100%;padding:13px 14px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:#080e19;color:var(--text);outline:0}.field:focus{border-color:#806cffaa}.btn{border:0;border-radius:12px;padding:12px 16px;background:linear-gradient(135deg,#806cff,#5b45dc);color:#fff;font-weight:950;cursor:pointer}.wide{width:100%;margin-top:8px}.status{min-height:20px;color:var(--muted);margin-top:10px;font-size:13px}.dash{padding:38px 0 80px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.head h1{margin:3px 0 0;font-size:clamp(34px,5vw,52px);letter-spacing:-.05em}.headActions{display:flex;gap:8px;flex-wrap:wrap}.ghost{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff0;color:var(--muted);font-weight:850;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.stat{padding:18px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:22px 0 0;padding-bottom:3px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:#fff0;color:var(--muted);font-weight:900;cursor:pointer}.tab.active{color:#fff;border-color:#806cff88;background:#806cff18}.panel{display:none;margin-top:14px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.panel.active{display:block}.panel h2{margin:0 0 15px}.row{padding:17px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{display:inline-block;padding:4px 8px;border-radius:99px;border:1px solid #fff2;font-size:11px;font-weight:950}.pending{color:#ffd783;border-color:#ffd78344}.accepted{color:#6ee7c8;border-color:#18d6a744}.rejected{color:#ff9aaa;border-color:#ff667d44}.meta{color:var(--muted);font-size:12px;line-height:1.6}.bodytext{margin-top:9px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.action{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff0;color:#fff;font-weight:850;cursor:pointer}.ok{color:#73ead2;border-color:#18d6a744}.bad{color:#ff9aaa;border-color:#ff667d44}.settings{display:grid;grid-template-columns:1fr 1fr;gap:13px}.setting{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card2)}.setting label{display:block;font-weight:900;margin-bottom:7px}.check{display:flex;align-items:center;gap:9px;margin:12px 0}.check input{width:18px;height:18px}.empty,.error{padding:18px;border-radius:13px;background:#fff1;color:var(--muted)}.error{color:#ff9aaa;border:1px solid #ff667d33}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.topin{min-height:62px}.brand{font-size:16px}.stats{grid-template-columns:1fr 1fr}.dash{padding-top:25px}.head{align-items:start;flex-direction:column}.settings{grid-template-columns:1fr}.panel{padding:16px}.rowtop{flex-direction:column}}
</style></head><body><header class="top"><div class="wrap topin"><div class="brand">NEXORA<b>.</b> CONTROL</div><a href="index.html">← Site</a></div></header><main id="root"></main>
<script>
const API='https://ahmedadlyabodhb-wvyxf.faable.link';const root=document.querySelector('#root');let settings={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){root.innerHTML='<section class="login"><form class="box" id="login"><h1>Admin Access</h1><p class="muted">Secure control center for NEXORA, applications, messages and site settings.</p><input class="field" name="username" autocomplete="username" required placeholder="Admin username"><input class="field" name="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn wide">Sign in</button><div class="status" id="loginStatus"></div></form></section>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,s=document.querySelector('#loginStatus'),b=f.querySelector('button');b.disabled=true;s.textContent='Signing in…';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Login failed');await dashboard()}catch(err){s.textContent=err.message||'Could not connect to server.'}finally{b.disabled=false}}}
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`Server returned ${r.status}`);return j}
async function dashboard(){try{const d=await api('/api/admin/summary');settings=(await api('/api/admin/site-config')).settings||{};root.innerHTML=`<section class="dash wrap"><div class="head"><div><div style="color:#9b8dff;font-weight:900;letter-spacing:.12em;font-size:11px">NEXORA CONTROL CENTER</div><h1>Everything in one place.</h1><div class="muted">Manage applications, messages and public site switches.</div></div><div class="headActions"><button class="ghost" onclick="refreshAll()">↻ Refresh</button><button class="ghost" onclick="logout()">Log out</button></div></div><div class="stats"><div class="stat"><strong>${d.applications||0}</strong><span>Applications</span></div><div class="stat"><strong>${d.pending||0}</strong><span>Pending</span></div><div class="stat"><strong>${d.qualified||0}</strong><span>Qualified</span></div><div class="stat"><strong>${d.members||0}</strong><span>Members</span></div><div class="stat"><strong>${d.rejected||0}</strong><span>Rejected</span></div><div class="stat"><strong>${d.messages||0}</strong><span>Messages</span></div></div><nav class="tabs"><button class="tab active" data-tab="apps">Applications</button><button class="tab" data-tab="messages">Messages</button><button class="tab" data-tab="site">Site controls</button></nav><section class="panel active" id="apps"><h2>Applications</h2><div id="appsList">Loading…</div></section><section class="panel" id="messages"><h2>Messages</h2><div id="msgList">Loading…</div></section><section class="panel" id="site"><h2>Site controls</h2><div class="settings"><div class="setting"><label>Site title</label><input class="field" id="siteTitle" value="${esc(settings.site_title||'Ahmed Adly — Python Developer')}"><label>Site mode</label><select class="field" id="siteStatus"><option value="online" ${settings.site_status==='online'?'selected':''}>Online</option><option value="maintenance" ${settings.site_status==='maintenance'?'selected':''}>Maintenance</option></select></div><div class="setting"><label>Feature switches</label><label class="check"><input id="nexoraEnabled" type="checkbox" ${settings.nexora_enabled!=='false'?'checked':''}> NEXORA enabled</label><label class="check"><input id="contactEnabled" type="checkbox" ${settings.contact_enabled!=='false'?'checked':''}> Contact enabled</label><label>Maintenance message</label><textarea class="field" id="maintenanceMessage" rows="4">${esc(settings.maintenance_message||'')}</textarea></div></div><button class="btn" style="margin-top:13px" onclick="saveSettings()">Save site settings</button><div id="saveStatus" class="status"></div></section></section>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));await Promise.all([loadApplications(),loadMessages()])}catch(e){login()}}
function switchTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===name))}
async function loadApplications(){const el=document.querySelector('#appsList');try{const rows=await api('/api/admin/applications');el.innerHTML=rows.length?rows.map(x=>`<article class="row"><div class="rowtop"><div><b>${esc(x.name||'Applicant')}</b> <span class="pill ${esc(x.status)}">${esc(x.status||'pending')}</span><div class="meta">#${x.id} · Score ${x.score} · ${esc(x.github||'No GitHub')} · ${esc(x.created_at)}</div></div></div><div class="bodytext"><b>Skills:</b> ${esc(x.skills)}\n<b>Why:</b> ${esc(x.why)}</div><div class="actions"><button class="action ok" onclick="setApp(${x.id},'accepted')">✓ Accept</button><button class="action bad" onclick="setApp(${x.id},'rejected')">✕ Reject</button><button class="action" onclick="setApp(${x.id},'pending')">↺ Pending</button><button class="action bad" onclick="deleteApp(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No applications yet.</div>'}catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function setApp(id,status){try{await api('/api/admin/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refreshAll()}catch(e){alert(e.message)}}
async function deleteApp(id){if(!confirm('Delete this application?'))return;try{await api('/api/admin/applications/'+id,{method:'DELETE'});await refreshAll()}catch(e){alert(e.message)}}
async function loadMessages(){const el=document.querySelector('#msgList');try{const rows=await api('/api/admin/messages');el.innerHTML=rows.length?rows.map(x=>`<article class="row"><div class="rowtop"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.email||'No email')} · ${esc(x.created_at)} · #${x.id}</div></div></div><div class="bodytext">${esc(x.message)}</div><div class="actions"><button class="action bad" onclick="deleteMsg(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No messages yet.</div>'}catch(e){el.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function deleteMsg(id){if(!confirm('Delete this message?'))return;try{await api('/api/admin/messages/'+id,{method:'DELETE'});await refreshAll()}catch(e){alert(e.message)}}
async function saveSettings(){const s=document.querySelector('#saveStatus');s.textContent='Saving…';try{settings=(await api('/api/admin/site-config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_title:document.querySelector('#siteTitle').value,site_status:document.querySelector('#siteStatus').value,nexora_enabled:document.querySelector('#nexoraEnabled').checked?'true':'false',contact_enabled:document.querySelector('#contactEnabled').checked?'true':'false',maintenance_message:document.querySelector('#maintenanceMessage').value})})).settings;s.textContent='Saved successfully.'}catch(e){s.textContent=e.message}}
async function refreshAll(){const active=document.querySelector('.tab.active')?.dataset.tab||'apps';await dashboard();switchTab(active)}
async function logout(){await fetch(API+'/api/admin/logout',{method:'POST',credentials:'include'}).catch(()=>{});login()}
dashboard();
</script></body></html>
