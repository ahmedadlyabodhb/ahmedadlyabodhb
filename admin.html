<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Control Center</title><style>:root{--bg:#070b14;--card:#101827;--card2:#0c1320;--line:#25334b;--text:#f5f7ff;--muted:#94a3bd;--p:#806cff;--g:#18d6a7;--r:#ff667d;--y:#ffd783}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#806cff28,transparent 30%),radial-gradient(circle at 90% 10%,#18d6a71b,transparent 28%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}button,input,textarea,select{font:inherit}.wrap{width:min(1200px,92%);margin:auto}.top{position:sticky;top:0;z-index:20;border-bottom:1px solid #fff1;background:#080d18dd;backdrop-filter:blur(18px)}.topin{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:1000;letter-spacing:.1em}.brand b{color:var(--p)}a{color:var(--muted);text-decoration:none;font-weight:850}.login{min-height:calc(100vh - 68px);display:grid;place-items:center}.box{width:min(430px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:#101827ee;box-shadow:0 30px 100px #0007}.box h1{margin:0 0 7px;font-size:34px}.muted{color:var(--muted);line-height:1.65}.field{width:100%;padding:12px 13px;margin:5px 0;border:1px solid var(--line);border-radius:12px;background:#080e19;color:var(--text);outline:0}.field:focus{border-color:#806cff88;box-shadow:0 0 0 3px #806cff18}.btn{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#806cff,#5b45dc);color:#fff;font-weight:950;cursor:pointer}.btn:disabled,.action:disabled{opacity:.55;cursor:not-allowed}.wide{width:100%;margin-top:8px}.status{min-height:20px;color:var(--muted);margin-top:9px;font-size:13px}.dash{padding:34px 0 80px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:20px}.head h1{margin:4px 0 0;font-size:clamp(34px,5vw,52px);letter-spacing:-.05em}.headActions,.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}.ghost,.tab,.action{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff0;color:var(--muted);font-weight:850;cursor:pointer}.live{display:inline-flex;align-items:center;gap:7px;color:#73ead2;font-size:12px;font-weight:900}.live i{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{padding:17px;border:1px solid var(--line);border-radius:17px;background:var(--card)}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0 0;padding-bottom:3px}.tab{white-space:nowrap}.tab.active{color:#fff;border-color:#806cff88;background:#806cff18}.panel{display:none;margin-top:13px;padding:21px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.panel.active{display:block}.panelHead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:10px}.panelHead h2{margin:0}.filters{margin:10px 0 5px}.filters .field{width:auto;min-width:170px}.row{padding:17px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.rowtop{display:flex;justify-content:space-between;gap:12px;align-items:start}.identity{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#806cff18;border:1px solid #806cff40;color:#b8adff;font-weight:950;flex:0 0 auto}.pill{display:inline-block;padding:4px 8px;border-radius:99px;border:1px solid #fff2;font-size:11px;font-weight:950}.pending{color:var(--y);border-color:#ffd78344}.accepted{color:#6ee7c8;border-color:#18d6a744}.rejected{color:#ff9aaa;border-color:#ff667d44}.active{color:#6ee7c8}.inactive{color:#ff9aaa}.new{margin-left:5px;color:#fff;background:#806cff;border:0}.meta{color:var(--muted);font-size:12px;line-height:1.6}.bodytext{margin-top:9px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.actions{margin-top:11px}.action{color:#fff}.ok{color:#73ead2;border-color:#18d6a744}.bad{color:#ff9aaa;border-color:#ff667d44}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.editgrid .full{grid-column:1/-1}.member{padding:16px 0;border-bottom:1px solid #ffffff12}.member:last-child{border-bottom:0}.settings{display:grid;grid-template-columns:1fr 1fr;gap:13px}.setting{padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card2)}.setting label{display:block;font-weight:900;margin-bottom:5px}.check{display:flex!important;align-items:center;gap:9px;margin:11px 0}.check input{width:18px;height:18px}.empty,.error{padding:18px;border-radius:13px;background:#fff1;color:var(--muted)}.error{color:#ff9aaa;border:1px solid #ff667d33}.toast{position:fixed;right:18px;bottom:18px;z-index:99;max-width:360px;padding:13px 15px;border:1px solid #18d6a755;border-radius:13px;background:#0d1828f2;box-shadow:0 20px 60px #0008;color:#bff9eb}.small{font-size:12px;color:var(--muted)}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.topin{min-height:62px}.brand{font-size:16px}.dash{padding-top:23px}.head{align-items:start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.panel{padding:15px}.rowtop{flex-direction:column}.settings,.editgrid{grid-template-columns:1fr}.editgrid .full{grid-column:auto}.filters .field{width:100%;min-width:0}.headActions,.headActions .ghost{width:100%}.headActions .ghost{text-align:center}.panelHead{align-items:start;flex-direction:column}}</style></head><body><header class="top"><div class="wrap topin"><div class="brand">NEXORA<b>.</b> CONTROL</div><a href="index.html">← Site</a></div></header><main id="root"></main><script>const root=document.querySelector('#root');let timer=null,state={apps:[],messages:[],members:[],settings:{},tab:'apps'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'include',...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||`Server returned ${r.status}`);return j};function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}function login(){clearInterval(timer);root.innerHTML='<section class="login"><form class="box" id="login"><h1>Admin Access</h1><p class="muted">Secure NEXORA control center. Records never disappear unless you explicitly delete them.</p><input class="field" name="username" autocomplete="username" required placeholder="Admin username"><input class="field" name="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn wide">Sign in</button><div class="status" id="loginStatus"></div></form></section>';document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),s=document.querySelector('#loginStatus');b.disabled=true;s.textContent='Signing in…';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});await boot()}catch(err){s.textContent=err.message}finally{b.disabled=false}}}function shell(){root.innerHTML=`<section class="dash wrap"><div class="head"><div><div style="color:#9b8dff;font-weight:900;letter-spacing:.12em;font-size:11px">NEXORA CONTROL CENTER</div><h1>Everything in one place.</h1><div class="muted">Applications, messages, members and site controls. <span class="live"><i></i>Live</span></div></div><div class="headActions"><button class="ghost" onclick="refresh()">↻ Refresh</button><button class="ghost" onclick="logout()">Log out</button></div></div><div class="stats" id="stats"></div><nav class="tabs"><button class="tab active" data-tab="apps">Applications</button><button class="tab" data-tab="messages">Messages</button><button class="tab" data-tab="members">Members</button><button class="tab" data-tab="site">Site controls</button></nav><section class="panel active" id="apps"><div class="panelHead"><h2>Applications</h2><span class="small">New records are highlighted; refresh never deletes anything.</span></div><div class="filters"><input class="field" id="appSearch" placeholder="Search name, username, GitHub or skills"><select class="field" id="appFilter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select></div><div id="appsList">Loading…</div></section><section class="panel" id="messages"><div class="panelHead"><h2>Messages</h2><span class="small">Messages remain until Delete is pressed.</span></div><div class="filters"><input class="field" id="msgSearch" placeholder="Search messages or names"></div><div id="msgList">Loading…</div></section><section class="panel" id="members"><div class="panelHead"><h2>NEXORA Members</h2><span class="small">Accepted applications become active members automatically.</span></div><div id="membersList">Loading…</div></section><section class="panel" id="site"><h2>Site controls</h2><div class="settings"><div class="setting"><label>Site title</label><input class="field" id="siteTitle"><label>Site mode</label><select class="field" id="siteStatus"><option value="online">Online</option><option value="maintenance">Maintenance</option></select></div><div class="setting"><label>Feature switches</label><label class="check"><input id="nexoraEnabled" type="checkbox"> NEXORA enabled</label><label class="check"><input id="contactEnabled" type="checkbox"> Contact enabled</label><label>Maintenance message</label><textarea class="field" id="maintenanceMessage" rows="4"></textarea></div></div><button class="btn" style="margin-top:13px" onclick="saveSettings()">Save site settings</button><div id="saveStatus" class="status"></div></section></section>`;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));document.querySelector('#appSearch').oninput=renderApps;document.querySelector('#appFilter').onchange=renderApps;document.querySelector('#msgSearch').oninput=renderMessages;applySettings()}function applySettings(){document.querySelector('#siteTitle').value=state.settings.site_title||'';document.querySelector('#siteStatus').value=state.settings.site_status||'online';document.querySelector('#nexoraEnabled').checked=state.settings.nexora_enabled!=='false';document.querySelector('#contactEnabled').checked=state.settings.contact_enabled!=='false';document.querySelector('#maintenanceMessage').value=state.settings.maintenance_message||''}function switchTab(name){state.tab=name;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===name));if(name==='apps')renderApps();if(name==='messages')renderMessages();if(name==='members')renderMembers()}function renderStats(s){document.querySelector('#stats').innerHTML=`<div class="stat"><strong>${s.applications}</strong><span>Applications</span></div><div class="stat"><strong>${s.pending}</strong><span>Pending</span></div><div class="stat"><strong>${s.qualified}</strong><span>Qualified</span></div><div class="stat"><strong>${s.members}</strong><span>Active members</span></div><div class="stat"><strong>${s.rejected}</strong><span>Rejected</span></div><div class="stat"><strong>${s.messages}</strong><span>Messages</span></div>`}function isNew(type,id){const key=type==='apps'?'nexoraLastApp':'nexoraLastMsg';return Number(id)>Number(localStorage.getItem(key)||0)}function markSeen(type){const list=type==='apps'?state.apps:state.messages;const max=list.reduce((m,x)=>Math.max(m,Number(x.id)||0),0);if(type==='apps')localStorage.setItem('nexoraLastApp',max);else localStorage.setItem('nexoraLastMsg',max)}function renderApps(){const q=(document.querySelector('#appSearch')?.value||'').toLowerCase();const f=document.querySelector('#appFilter')?.value||'all';const list=state.apps.filter(x=>(f==='all'||x.status===f)&&(!q||`${x.name} ${x.username} ${x.github} ${x.skills} ${x.why}`.toLowerCase().includes(q)));document.querySelector('#appsList').innerHTML=list.length?list.map(x=>`<article class="row"><div class="rowtop"><div class="identity"><div class="avatar">${esc((x.username||x.name||'?')[0].toUpperCase())}</div><div><b>${esc(x.name)}</b> <span class="pill ${esc(x.status)}">${esc(x.status)}</span>${isNew('apps',x.id)?'<span class="pill new">NEW</span>':''}<div class="meta"><b>@${esc(x.username||'no-username')}</b> · #${x.id} · Score ${x.score} · ${esc(x.github||'No GitHub')} · ${esc(x.created_at)}</div></div></div></div><div class="bodytext"><b>Skills:</b> ${esc(x.skills)}\n<b>Why:</b> ${esc(x.why)}</div><div class="actions"><button class="action ok" onclick="setApp(${x.id},'accepted')">✓ Accept</button><button class="action bad" onclick="setApp(${x.id},'rejected')">✕ Reject</button><button class="action" onclick="setApp(${x.id},'pending')">↺ Pending</button><button class="action bad" onclick="deleteApp(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No matching applications.</div>';markSeen('apps')}function renderMessages(){const q=(document.querySelector('#msgSearch')?.value||'').toLowerCase();const list=state.messages.filter(x=>!q||`${x.name} ${x.email} ${x.message}`.toLowerCase().includes(q));document.querySelector('#msgList').innerHTML=list.length?list.map(x=>`<article class="row"><div class="rowtop"><div><b>${esc(x.name)}</b>${isNew('msgs',x.id)?'<span class="pill new">NEW</span>':''}<div class="meta">${esc(x.email||'No email')} · ${esc(x.created_at)} · #${x.id}</div></div></div><div class="bodytext">${esc(x.message)}</div><div class="actions"><button class="action bad" onclick="deleteMsg(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No matching messages.</div>';markSeen('msgs')}function renderMembers(){const list=state.members;document.querySelector('#membersList').innerHTML=list.length?list.map(x=>`<article class="member"><div class="rowtop"><div class="identity"><div class="avatar">${esc((x.username||x.name)[0].toUpperCase())}</div><div><b>${esc(x.name)}</b> <span class="pill ${x.active?'active':'inactive'}">${x.active?'active':'hidden'}</span><div class="meta">@${esc(x.username)} · ${esc(x.role)}${x.github?' · '+esc(x.github):''}</div></div></div></div><div class="editgrid"><input class="field" id="mn${x.id}" value="${esc(x.name)}" placeholder="Name"><input class="field" id="mu${x.id}" value="${esc(x.username)}" placeholder="Username"><input class="field" id="mg${x.id}" value="${esc(x.github||'')}" placeholder="GitHub"><input class="field" id="mr${x.id}" value="${esc(x.role)}" placeholder="Role"><input class="field full" id="ms${x.id}" value="${esc(x.skills)}" placeholder="Skills"><textarea class="field full" id="mb${x.id}" rows="3" placeholder="Bio">${esc(x.bio||'')}</textarea></div><div class="actions"><button class="action ok" onclick="saveMember(${x.id})">Save member</button><button class="action" onclick="toggleMember(${x.id},${x.active?0:1})">${x.active?'Hide':'Show'}</button><button class="action bad" onclick="deleteMember(${x.id})">Delete</button></div></article>`).join(''):'<div class="empty">No members yet. Accept an application to create one.</div>'}async function refresh(){try{const [s,a,m,mem,c]=await Promise.all([api('/api/admin/summary'),api('/api/admin/applications'),api('/api/admin/messages'),api('/api/admin/members'),api('/api/admin/site-config')]);state.apps=a;state.messages=m;state.members=mem;state.settings=c.settings||{};if(!document.querySelector('#stats'))shell();renderStats(s);renderApps();renderMessages();renderMembers()}catch(e){if(e.message==='Unauthorized')login();else if(document.querySelector('#appsList'))document.querySelector('#appsList').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}async function boot(){try{await api('/api/admin/summary');const c=await api('/api/admin/site-config');state.settings=c.settings||{};shell();await refresh();clearInterval(timer);timer=setInterval(refresh,15000)}catch(e){login()}}async function setApp(id,status){try{await api('/api/admin/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast('Application updated.');await refresh()}catch(e){toast(e.message)}}async function deleteApp(id){if(!confirm('Delete this application permanently?'))return;try{await api('/api/admin/applications/'+id,{method:'DELETE'});toast('Application deleted.');await refresh()}catch(e){toast(e.message)}}async function deleteMsg(id){if(!confirm('Delete this message permanently?'))return;try{await api('/api/admin/messages/'+id,{method:'DELETE'});toast('Message deleted.');await refresh()}catch(e){toast(e.message)}}async function saveMember(id){const d={name:document.querySelector('#mn'+id).value,username:document.querySelector('#mu'+id).value,github:document.querySelector('#mg'+id).value,role:document.querySelector('#mr'+id).value,skills:document.querySelector('#ms'+id).value,bio:document.querySelector('#mb'+id).value,active:true};try{await api('/api/admin/members/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});toast('Member saved.');await refresh()}catch(e){toast(e.message)}}async function toggleMember(id,active){try{await api('/api/admin/members/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!!active})});toast(active?'Member shown.':'Member hidden.');await refresh()}catch(e){toast(e.message)}}async function deleteMember(id){if(!confirm('Delete this member permanently?'))return;try{await api('/api/admin/members/'+id,{method:'DELETE'});toast('Member deleted.');await refresh()}catch(e){toast(e.message)}}async function saveSettings(){const s=document.querySelector('#saveStatus');s.textContent='Saving…';try{state.settings=(await api('/api/admin/site-config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_title:document.querySelector('#siteTitle').value,site_status:document.querySelector('#siteStatus').value,nexora_enabled:document.querySelector('#nexoraEnabled').checked?'true':'false',contact_enabled:document.querySelector('#contactEnabled').checked?'true':'false',maintenance_message:document.querySelector('#maintenanceMessage').value})})).settings;applySettings();s.textContent='Saved successfully.';toast('Site settings saved.')}catch(e){s.textContent=e.message}}async function logout(){clearInterval(timer);await api('/api/admin/logout',{method:'POST'}).catch(()=>{});login()}boot();</script></body></html>
