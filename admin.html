<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Admin</title><style>:root{--bg:#070b14;--card:#101827;--line:#26344b;--text:#f4f7ff;--muted:#94a2bb;--p:#806cff;--g:#18d6a7;--danger:#ff657a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#806cff30,transparent 32%),radial-gradient(circle at 90% 10%,#18d6a720,transparent 28%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}.wrap{width:min(1180px,92%);margin:auto}.nav{height:70px;border-bottom:1px solid #fff1;background:#080d18dd;backdrop-filter:blur(18px);display:flex;align-items:center}.navin{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:1000;letter-spacing:.12em}.brand b{color:var(--p)}.back{color:var(--muted);font-weight:800}.login{min-height:calc(100vh - 70px);display:grid;place-items:center}.box{width:min(430px,100%);padding:32px;border:1px solid var(--line);border-radius:25px;background:#101827e8;box-shadow:0 30px 100px #0006}.box h1{font-size:34px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.7}.field{width:100%;padding:14px;margin:8px 0;border:1px solid var(--line);border-radius:13px;background:#080e19;color:#fff;outline:none}.field:focus{border-color:#806cff99}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#806cff,#5a43dc);color:#fff;font-weight:950;cursor:pointer;margin-top:8px}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:13px}.dashboard{padding:45px 0 80px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}.head h1{font-size:45px;line-height:1;margin:0}.logout{border:1px solid var(--line);background:#fff0;color:var(--muted);padding:10px 13px;border-radius:11px;font-weight:850;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:22px;border:1px solid var(--line);border-radius:19px;background:#101827}.stat strong{display:block;font-size:31px}.stat span{color:var(--muted);font-size:13px}.panel{margin-top:20px;padding:25px;border:1px solid var(--line);border-radius:22px;background:#101827}.panel h2{margin-top:0}.notice{padding:15px;border-radius:13px;background:#18d6a710;border:1px solid #18d6a733;color:#8bf1d8}.danger{background:#ff657a10;border-color:#ff657a33;color:#ff9baa}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.head{align-items:start}.head h1{font-size:35px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header class="nav"><div class="wrap navin"><div class="brand">NEXORA<b>.</b> ADMIN</div><a class="back" href="index.html">← Site</a></div></header><main id="app"></main><script>const API='https://ahmed-adly-portfolio.onrender.com';const app=document.querySelector('#app');function login(){app.innerHTML=`<section class="login"><form class="box" id="login"><h1>Admin Access</h1><p class="muted">Private NEXORA dashboard. Authentication must be handled by the server; no password is stored in this page.</p><input class="field" name="username" autocomplete="username" required placeholder="Admin username"><input class="field" name="password" type="password" autocomplete="current-password" required placeholder="Password"><button class="btn">Sign in securely</button><div id="status" class="status"></div></form></section>`;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,s=document.querySelector('#status'),b=f.querySelector('button');b.disabled=true;s.textContent='Authenticating…';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(!r.ok)throw Error('Unauthorized');await dashboard()}catch(err){s.textContent='Admin server authentication is not configured yet.'}finally{b.disabled=false}}}async function dashboard(){try{const r=await fetch(API+'/api/admin/summary',{credentials:'include'});if(!r.ok)throw Error();const d=await r.json();app.innerHTML=`<section class="dashboard wrap"><div class="head"><div><div style="color:#9b8dff;font-weight:900">NEXORA CONTROL CENTER</div><h1>Admin Dashboard</h1></div><button class="logout" onclick="logout()">Log out</button></div><div class="grid"><div class="stat"><strong>${d.applications??0}</strong><span>Applications</span></div><div class="stat"><strong>${d.qualified??0}</strong><span>Qualified</span></div><div class="stat"><strong>${d.members??0}</strong><span>Team members</span></div><div class="stat"><strong>${d.messages??0}</strong><span>Messages</span></div></div><div class="panel"><h2>Applications</h2><div id="applications">Loading secure data…</div></div></section>`;loadApplications()}catch(e){login()}}async function loadApplications(){const el=document.querySelector('#applications');try{const r=await fetch(API+'/api/admin/applications',{credentials:'include'});if(!r.ok)throw Error();const rows=await r.json();el.innerHTML=rows.length?rows.map(x=>`<div style="padding:15px 0;border-bottom:1px solid #ffffff12"><b>${escapeHtml(x.name||'Applicant')}</b> — ${escapeHtml(x.status||'pending')}<div class="muted">Score: ${escapeHtml(String(x.score??'—'))} · GitHub: ${escapeHtml(x.github||'—')}</div></div>`).join(''):'No applications yet.'}catch(e){el.innerHTML='<div class="notice danger">Could not load applications from the secure server.</div>'}}async function logout(){await fetch(API+'/api/admin/logout',{method:'POST',credentials:'include'}).catch(()=>{});login()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}dashboard();</script></body></html>
