name: Add NEXORA Team Navigation

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/add-team-nav.yml'

permissions:
  contents: write

jobs:
  patch-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'class="joinNav"' in s:
              print('Team navigation already present.')
              raise SystemExit(0)
          old = '<a href="#services" data-en="Services" data-ar="الخدمات">Services</a><a href="#contact" data-en="Contact" data-ar="تواصل">Contact</a>'
          new = '<a href="#services" data-en="Services" data-ar="الخدمات">Services</a><a class="teamNav" href="team.html" data-en="Team" data-ar="الفريق">Team</a><a class="joinNav" href="join.html" data-en="Join the Team ↗" data-ar="انضم للفريق ↗">Join the Team ↗</a><a href="#contact" data-en="Contact" data-ar="تواصل">Contact</a>'
          if old not in s:
              raise SystemExit('Expected navigation markup was not found; no change made.')
          s = s.replace(old, new, 1)
          css_old = '.links a:hover{color:var(--p)}'
          css_new = '''.links a:hover{color:var(--p)}
          .teamNav{position:relative}
          .joinNav{padding:10px 14px;border-radius:13px;color:#fff!important;background:linear-gradient(135deg,#816cff,#5d46dc);box-shadow:0 10px 28px #7058ff30;transition:.25s!important;position:relative;overflow:hidden}
          .joinNav:hover{color:#fff!important;transform:translateY(-3px);box-shadow:0 16px 38px #7058ff45}
          .joinNav:after{content:"";position:absolute;inset:0;border-radius:13px;background:linear-gradient(115deg,transparent 35%,#fff5 50%,transparent 65%);transform:translateX(-120%);transition:.6s;pointer-events:none}
          .joinNav:hover:after{transform:translateX(120%)}'''
          if css_old in s:
              s = s.replace(css_old, css_new, 1)
          mobile_old = '@media(max-width:850px){.links a{display:none}'
          mobile_new = '@media(max-width:850px){.links a{display:none}.links .teamNav,.links .joinNav{display:inline-flex}'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add Team and Join the Team navigation'
            git push
          fi
